name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend (lint/test/build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install
      - name: Lint
        run: pnpm -C apps/web-client lint
      - name: Type check
        run: pnpm -C apps/web-client type-check
      - name: Unit tests
        run: pnpm -C apps/web-client test
      - name: Build
        run: pnpm -C apps/web-client build

  backend:
    name: Backend (lint/test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: uv pip install -e ".[dev]"
      - name: Lint
        run: |
          uv run ruff check server shared
          uv run black --check server shared
          uv run isort --check-only server shared
      - name: Unit tests
        run: uv run pytest

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    env:
      VITE_REALTIME_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pnpm install
          uv pip install -e ".[dev]"
      - name: Install Playwright browsers
        run: pnpm -C apps/web-client exec playwright install --with-deps chromium
      - name: Start backend
        run: uv run uvicorn server.main:app --port 8000 --host 0.0.0.0 &
      - name: Run Playwright tests
        run: pnpm -C apps/web-client test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web-client/playwright-report
            apps/web-client/test-results
          if-no-files-found: ignore

  security:
    name: Security (trivy/trufflehog/pii)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy FS scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-dirs: .git,node_modules,.venv,dist,build,coverage
      - name: TruffleHog secrets scan
        uses: trufflesecurity/trufflehog@v3.76.3
        with:
          path: .
          extra_args: --only-verified --exclude-paths .github/trufflehog-exclude.txt
      - name: PII pattern scan
        run: |
          rg -n "(\\b\\d{6}-\\d{7}\\b|\\b\\d{3}-\\d{2}-\\d{4}\\b|\\b\\d{2,3}-\\d{3,4}-\\d{4}\\b|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,})" . \
            --glob '!.git/**' \
            --glob '!node_modules/**' \
            --glob '!.venv/**' \
            --glob '!dist/**' \
            --glob '!build/**' \
            --glob '!coverage/**' \
            && exit 1 || true

  dependencies:
    name: Dependencies (audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pnpm install
          uv pip install -e ".[dev]"
          uv pip install pip-audit
      - name: pnpm audit
        run: pnpm audit --audit-level high
      - name: pip-audit
        run: uv run pip-audit
