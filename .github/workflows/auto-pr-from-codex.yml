name: Auto PR from Codex

# Codex가 특정 브랜치에 push하면 자동으로 PR 생성
on:
  push:
    branches:
      - 'codex/**'  # codex로 시작하는 브랜치만

permissions:
  contents: write
  pull-requests: write

jobs:
  create-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract task info
        id: task-info
        run: |
          # 브랜치명에서 task 파일명 추출
          # 예: codex/phase4-dashboard → docs/tasks/codex-*-phase4-dashboard.md
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          TASK_SUFFIX="${BRANCH_NAME#codex/}"

          # Task 파일 찾기
          TASK_FILE=$(find docs/tasks -name "*${TASK_SUFFIX}.md" | head -1)

          if [ -z "$TASK_FILE" ]; then
            echo "Task file not found for branch: $BRANCH_NAME"
            exit 1
          fi

          echo "task_file=$TASK_FILE" >> $GITHUB_OUTPUT

          # Task 파일에서 Goal 추출
          GOAL=$(grep -A 1 "## 1. Goal" "$TASK_FILE" | tail -1 | sed 's/^[*-] //')
          echo "goal=$GOAL" >> $GITHUB_OUTPUT

          # PR 제목 생성 (첫 번째 라인에서 추출)
          PR_TITLE=$(head -1 "$TASK_FILE" | sed 's/^# Task: //')
          echo "pr_title=feat: $PR_TITLE" >> $GITHUB_OUTPUT

      - name: Create PR body
        id: pr-body
        run: |
          TASK_FILE="${{ steps.task-info.outputs.task_file }}"

          # PR body 생성
          cat > pr_body.md <<'EOF'
          ## Summary
          ${{ steps.task-info.outputs.goal }}

          ## Changes
          $(git diff --name-status origin/main... | awk '{print "- " $1 ": `" $2 "`"}')

          ## Task File
          Implemented from: `${{ steps.task-info.outputs.task_file }}`

          ## Test Plan
          See task file for detailed test commands.

          🤖 Auto-generated PR from Codex branch

          Co-Authored-By: Claude Sonnet 4.5 <noreply@anthropic.com>
          EOF

          echo "body_file=pr_body.md" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
          base: main
          title: ${{ steps.task-info.outputs.pr_title }}
          body-path: pr_body.md
          labels: |
            autogenerated
            needs-review
          draft: false

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const issue_number = context.payload.pull_request.number;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: '✅ Auto-generated PR from Codex. Please review the changes and run CI tests.'
            });
