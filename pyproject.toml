[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "befora-poc"
version = "0.1.0"
description = "Befora Voice AI Agent PoC"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "uvicorn[standard]>=0.30.0",
  "python-dotenv>=1.0",
  "openai>=1.54.0",
]

[project.optional-dependencies]
dev = [
  "black>=24.0.0",
  "ruff>=0.5.0",
  "isort>=5.13.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
]

[dependency-groups]
dev = [
  "black>=24.0.0",
  "ruff>=0.5.0",
  "isort>=5.13.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
]

[tool.uv]
dev-dependencies = [
  "black>=24.0.0",
  "ruff>=0.5.0",
  "isort>=5.13.0",
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "httpx>=0.27.0",
]

[tool.hatch.build.targets.wheel]
packages = ["server", "shared"]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | node_modules
)/
'''

[tool.ruff]
line-length = 88
target-version = "py311"
exclude = [
  ".git",
  ".venv",
  "__pycache__",
  "node_modules",
  "dist",
]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "B",    # flake8-bugbear
  "C4",   # flake8-comprehensions
  "UP",   # pyupgrade
]
ignore = [
  "E501",  # line too long (handled by black)
]

[tool.ruff.lint.isort]
known-first-party = ["server", "shared"]

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["server", "shared"]
skip = [".venv", "node_modules"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
